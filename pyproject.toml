[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-opensearch-skill"
version = "0.1.0"
description = "Secure macOS launcher and Codex configuration for the official OpenSearch MCP server"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "codex-opensearch-skill contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.8"]

[project.scripts]
codex-opensearch-mcp = "codex_opensearch_mcp.launcher:main"

[project.urls]
Documentation = "https://github.com/OWNER/codex-opensearch-skill#readme"
Issues = "https://github.com/OWNER/codex-opensearch-skill/issues"
Source = "https://github.com/OWNER/codex-opensearch-skill"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
